# The site is a static export, so the GitHub contribution heatmap is baked in
# at build time. This rebuilds and redeploys the Cloudflare Worker once a day
# to keep it fresh.
#
# Needs two repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare → My Profile → API Tokens → Create Token
#                            → template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard → Account home (right side)
name: Nightly rebuild

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 02:00 IST
  workflow_dispatch: # "Run workflow" button in the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.devansh10.workers.dev
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
